entity_definitions:
  GEJALA: Keluhan, tanda, atau temuan klinis pada pasien.
  OBAT: Nama obat, zat terapi, alat terapi, atau produk perawatan.
  DOSIS: Jumlah, kekuatan, bentuk, frekuensi, atau aturan pakai obat/terapi.
  DIAGNOSIS: Nama penyakit atau kondisi medis.
  ANATOMI: Bagian tubuh atau struktur anatomi.
  PROSEDUR: Tindakan, pemeriksaan, intervensi, vaksinasi, operasi, atau tes.
  HASIL_LAB: Nama parameter lab atau pemeriksaan penunjang.
  NILAI_LAB: Nilai, status, atau interpretasi hasil lab.
  WAKTU_DURASI: Waktu, tanggal relatif, frekuensi, atau lama kejadian/terapi.
  ALERGI: Kondisi, reaksi, atau jenis alergi.
  RIWAYAT_PENYAKIT: Kondisi medis yang secara eksplisit disebut sebagai riwayat pasien.

